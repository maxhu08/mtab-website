<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" type="text/css" href="styles/tailwind.css" />
  <link rel="stylesheet" type="text/css" href="styles/index.css" />
  <script src="scripts/index.ts" type="module" defer></script>
  <link rel="icon" href="assets/icon.svg" type="image/x-icon" />
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <title>mtab - customizable new tab page</title>
</head>

<body class="relative min-h-screen overflow-x-hidden bg-neutral-950 text-white">
  <div class="min-h-screen bg-neutral-950 text-white">
    <nav class="fixed top-0 left-0 right-0 z-50 border-b border-neutral-800/50 bg-neutral-950">
      <div class="mx-auto max-w-7xl px-6">
        <div class="flex h-16 items-center justify-between">
          <a href="/">
            <div class="flex items-center gap-8">
              <div class="grid grid-cols-[max-content_auto] gap-2">
                <img src="assets/icon.png" alt="mtab logo" class="h-6 w-6" />
                <p class="text-xl font-bold">mtab</p>
              </div>
            </div>
          </a>
          <!-- desktop menu -->
          <div class="hidden md:grid grid-flow-col gap-4">
            <a href="https://github.com/maxhu08/mtab" target="_blank"
              class="text-neutral-400 hover:text-white transition-colors duration-200">github</a>
            <a href="https://maxhu.dev/redirect/discord/mtab" target="_blank"
              class="text-neutral-400 hover:text-white transition-colors duration-200">discord</a>
          </div>
          <!-- mobile menu button -->
          <button id="mobile-menu-button"
            class="md:hidden relative w-6 h-6 text-neutral-400 hover:text-white transition-colors duration-200"
            aria-label="Toggle menu">
            <svg id="hamburger-icon" class="absolute inset-0 w-6 h-6" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
            <svg id="x-icon" class="absolute inset-0 w-6 h-6 hidden" fill="none" stroke="currentColor"
              viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
          </button>
        </div>
        <!-- mobile menu -->
        <div id="mobile-menu" class="hidden md:hidden pb-4">
          <div class="flex flex-col gap-3">
            <a href="https://github.com/maxhu08/mtab" target="_blank"
              class="text-neutral-400 hover:text-white transition-colors duration-200 py-2">github</a>
            <a href="https://maxhu.dev/redirect/discord/mtab" target="_blank"
              class="text-neutral-400 hover:text-white transition-colors duration-200 py-2">discord</a>
          </div>
        </div>
      </div>
    </nav>
    <main class="relative flex min-h-screen flex-col items-center justify-center px-6 pt-16">
      <div
        class="absolute inset-0 bg-[linear-gradient(to_right,#171717_1px,transparent_1px),linear-gradient(to_bottom,#171717_1px,transparent_1px)] bg-[size:4rem_4rem] [mask-image:radial-gradient(ellipse_60%_50%_at_50%_50%,#000_70%,transparent_100%)]">
      </div>
      <div class="relative z-10 flex flex-col items-center text-center pt-40">
        <button id="release-badge" type="button" class="mb-8 inline-flex items-center gap-2 rounded-full border border-emerald-500/20 bg-emerald-500/10 px-4 py-2 text-sm font-medium text-emerald-400
         shadow-[0_0_20px_rgba(16,185,129,0.15)]
         opacity-0 translate-y-2 transition-all duration-500 ease-out
         cursor-pointer focus:outline-none">
          <span class="relative flex h-2 w-2">
            <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex h-2 w-2 rounded-full bg-emerald-500"></span>
          </span>
          <span id="release-text">RELEASE</span>
        </button>
        <h1
          class="mb-6 bg-gradient-to-b from-white to-neutral-400 bg-clip-text text-6xl font-bold tracking-tight text-transparent sm:text-7xl md:text-8xl">
          mtab
        </h1>
        <p class="mb-12 max-w-2xl text-lg text-neutral-400 sm:text-xl">
          <span id="rotating-text"
            class="inline-block opacity-0 translate-y-4 transition duration-500 ease-out will-change-transform">
            🧠 the <span class="text-emerald-500">modern</span> new tab
          </span>
        </p>
        <div class="grid gap-2 max-w-md mx-auto">
          <div class="grid grid-cols-2 gap-2">
            <a href="https://chromewebstore.google.com/detail/mtab/fdaphilojaklgkoocegabckfanjoacjg" target="_blank"
              class="flex items-center justify-center h-12 md:h-16">
              <img src="assets/download/download-chrome.svg" alt="Download for Chrome"
                class="h-full w-auto max-w-full" />
            </a>
            <a href="https://addons.mozilla.org/firefox/addon/mtab" target="_blank"
              class="flex items-center justify-center h-12 md:h-16">
              <img src="assets/download/download-firefox.svg" alt="Download for Firefox"
                class="h-full w-auto max-w-full" />
            </a>
          </div>
          <div class="flex justify-center">
            <a href="https://microsoftedge.microsoft.com/addons/detail/mtab/nalkeaciblokbmlnfhbdbmnllppkcabe"
              target="_blank" class="flex items-center justify-center h-12 md:h-16">
              <img src="assets/download/download-edge.svg" alt="Download for Edge" class="h-full w-auto max-w-full" />
            </a>
          </div>
        </div>
      </div>
      <div id="preview" class="relative z-10 mt-16 w-[95vw] max-w-6xl px-4
         opacity-0 translate-y-4 transition-all duration-500 ease-out">
        <div class="bg-emerald-500 p-1 rounded-2xl overflow-hidden">
          <img src="assets/preview/main.png" alt="mtab preview"
            class="w-full h-auto max-h-[70vh] object-contain rounded-xl shadow-2xl" />
        </div>
      </div>
      <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
        <div class="h-[80vh] w-[80vw] rounded-full bg-emerald-500/10 blur-[120px]"></div>
      </div>
      <div class="mt-auto px-2 pt-40 pb-4">
        <p class="text-center text-base text-white">Made with ❤️ by Max Hu et al.</p>
      </div>
    </main>
  </div>
</body>
